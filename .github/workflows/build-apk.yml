# Compila el APK de Android en GitHub cada vez que se sube código a "main".
# El APK queda para descargar en la sección "Releases" del repositorio.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests
        run: npm test

      - name: Generar proyecto Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TaskApp – build ${{ github.run_number }}
          body: Descargá **app-release.apk** desde el celular para instalar la app.
          files: android/app/build/outputs/apk/release/app-release.apk
